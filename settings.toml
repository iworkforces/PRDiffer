[default]
# Application settings
app.debug = false
app.log_level = "INFO"
# Selected-file admission limit for full-context diffs (GitHub + GitLab).
# Runtime override via MAX_FILES_ALLOWED in .env (see .env.example / start script).
app.max_files_allowed = 50
app.incremental_mode = false

# Logging settings
app.logging_enabled = true
app.log_format = "simple"

# MCP request deadlines (must be strictly greater than github.timeout)
mcp.pr_diff_request_timeout_seconds = 180

# GitHub API settings
github.rate_limit = 5000
github.timeout = 30
github.max_retries = 3
github.retry_delay = 1

# Smart retry settings
github.retry_on_404 = false  # Don't retry 404 errors (file not found)
github.retry_on_403 = true   # Retry 403 errors (might be rate limiting)
github.retry_on_500 = true   # Retry 5xx server errors
github.retry_log_level = "DEBUG"  # Log retry attempts at DEBUG level instead of WARNING
github.permanent_failure_log_level = "INFO"  # Log permanent failures at INFO level

# File size limits (DoS prevention - prevents OOM from large files)
github.max_file_size_bytes = 10485760  # 10MB default - files larger than this will be skipped

# Rate limit retry thresholds
github.retry.rate_limit_remaining_threshold = 1  # Treat remaining <= threshold as rate-limited
github.retry.rate_limit_reset_buffer = 1         # Seconds to add to reset-based delays
github.retry.secondary_rate_limit_backoff = 60   # Base delay for secondary rate limits (seconds)

# Phase 3: Advanced error handling and context-aware strategies
github.circuit_breaker_enabled = true  # Enable circuit breaker pattern
github.circuit_breaker_failure_threshold = 5  # Failures before opening circuit
github.circuit_breaker_timeout = 60  # Seconds to keep circuit open
github.adaptive_retry_enabled = true  # Enable adaptive retry delays
github.max_adaptive_delay = 30  # Maximum adaptive delay in seconds
github.api_health_tracking = true  # Track API health metrics
github.context_aware_retry = true  # Enable context-aware retry strategies
github.max_concurrent = 4  # Maximum concurrent GitHub API operations

# GitLab API settings (strict full-diff)
gitlab.timeout = 30
gitlab.max_retries = 3
gitlab.max_concurrent = 4
gitlab.retry_transient_errors = true
gitlab.obey_rate_limit = true
gitlab.max_file_size_bytes = 10485760  # 10MB — binary/oversize fail closed (E5020)
# Host allowlist (bare hostnames, case-insensitive). Default GitLab.com only;
# opt-in custom-hosted instances by adding hostnames here (e.g. "gitlab.example.com").
# Override at runtime via GITLAB_ALLOWED_HOSTS=host1,host2 in .env (see .env.example).
gitlab.allowed_hosts = ["gitlab.com"]
# max_files_allowed / max_total_chars / pr_diff_request_timeout_seconds also resolve
# from app.max_files_allowed, diff.max_total_chars, mcp.pr_diff_request_timeout_seconds
# when gitlab.* overrides are absent. Runtime: MAX_FILES_ALLOWED / MAX_TOTAL_CHARS in .env.

# Performance optimization feature flags (dotted keys under [default]; not a Dynaconf env)
# Bounded concurrency (indexed batch, session CapacityLimiter, max_concurrent).
performance.parallel_file_fetch_enabled = true  # GitHub session tree/blob capacity (github.max_concurrent; 1 when false)
performance.parallel_diff_generation_enabled = true  # Parallel full-context per-file generation

# File filtering patterns (GitHub only; GitLab has no ignore filter).
# Runtime override via GITHUB_IGNORE_PATTERNS CSV in .env (replaces this list).
github.ignore_patterns = [
    # Hidden files and directories (matches .* and */.* patterns)
    "(^\\..*|.*/\\..*)",
    "*.lock",
    "package-lock.json",
    "*.log",
    "*.tmp",
    "*.bak",
    "*.swp",
    "*.swo",
    "node_modules/",
    "dist/",
    "build/",
    ".git/",
    ".venv/",
    "__pycache__/",
    ".idea/",
    ".vscode/",
    "coverage/",
    ".pytest_cache/",
    "*package-lock.json",
    "*.html",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.gif",
    "*.bmp",
    "*.ico",
    "*.svg",
    "*.webp",
    "*.tiff",
    "*.tif",
    "*.avif",
    "*.apng",
    "*.DS_Store",
]

github.valid_extensions = [
    ".py", ".js", ".ts", ".jsx", ".tsx", ".vue", ".svelte",
    ".java", ".kt", ".scala",
    ".cpp", ".c", ".h", ".hpp", ".cc", ".cxx",
    ".go", ".rs", ".rb", ".php", ".swift",
    ".html", ".css", ".scss", ".less", ".sass",
    ".md", ".txt", ".rst",
    ".json", ".yml", ".yaml", ".toml", ".xml",
    ".sql", ".sh", ".bash", ".zsh", ".fish", ".ps1",
    ".dockerfile", ".tf", ".tfvars"
]

# Diff generator parallel processing settings (enabled by performance.parallel_diff_generation_enabled)
github.diff_parallel_threshold = 3   # Minimum files to trigger parallel processing
github.diff_max_workers = 4          # Maximum worker threads for parallel processing

# Cache settings
cache.ttl = 600  # 10 minutes
cache.max_size = 1000
cache.enabled = true

# Cache key hashing settings
cache.use_hashed_keys = true           # Enable/disable key hashing (reduces memory for long repo names)
cache.hash_algorithm = "md5"            # Hash algorithm: md5 (32 chars), sha256 (64 chars)
cache.store_key_mapping = true          # Store hash→original mapping for debugging and stats

# MCP Server settings
mcp.transport = "http" # it coul be one of ["stdio", "http", "sse", "streamable-http"]
mcp.port = 9102
mcp.host = "127.0.0.1"
mcp.path = "/mcp"

# File processor settings
file_processor.max_workers = 4  # Maximum workers for parallel file processing

# Diff processing thresholds (for chunked processing of large files)
# These control when to use chunked diff generation to avoid O(N²) complexity
diff.large_file_threshold = 5000     # Lines - threshold for chunked processing
diff.chunk_size = 1000               # Lines per chunk for large files
diff.max_diff_size = 100000          # Maximum lines per file - larger files fail with E5020 RESPONSE_SIZE_LIMIT

# Diff size limits (strict: oversize fails closed, never truncates)
# Aggregate public-diff char budget (E5020 RESPONSE_SIZE_LIMIT). Runtime override
# via MAX_TOTAL_CHARS in .env (see .env.example / start-prdiffer-mcp-server.sh).
diff.max_total_chars = 600000

# Request coalescing settings
request_coalescing.max_waiters = 100
request_coalescing.timeout = 30.0  # Default timeout for request coalescing (seconds)

# Async parallel executor settings
async_parallel_executor.max_concurrent = 10  # Maximum concurrent async operations
async_parallel_executor.timeout = 30.0  # Default timeout for batch operations (seconds)
async_parallel_executor.error_strategy = "ignore"  # Options: ignore, raise, collect, continue

# Logging settings
logging.format = "simple"  # Options: simple, json, structured
logging.json_pretty = false  # Pretty-print JSON output (development only)

# Authentication is configured only through environment variables (not this file):
# - MCP_AUTH_ENABLED=true enables API key authentication (disabled when unset or false)
# - MCP_API_KEYS="key1,key2,key3" (comma-separated) and/or MCP_ADMIN_API_KEY
# Brute-force protection uses built-in defaults: 5 failures per minute, 60s lockout.

# Security headers for HTTP/SSE transports
# NOTE: FastMCP runs on uvicorn. For production deployments, use a reverse proxy
# (nginx, Apache, Caddy) to add security headers. Recommended headers:
# - X-Content-Type-Options: nosniff
# - X-Frame-Options: DENY or SAMEORIGIN
# - X-XSS-Protection: 1; mode=block
# - Content-Security-Policy: default-src 'self'
# - Strict-Transport-Security: max-age=31536000; includeSubDomains (HTTPS only)
# - Referrer-Policy: strict-origin-when-cross-origin

