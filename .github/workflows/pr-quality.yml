# Quality gates for pull requests targeting protected integration branches.
# Mirrors local start-lint.sh / start-type-check.sh / start-unittest.sh and the layer analyzer (without auto-upgrades).
name: PR Quality

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: uv run ruff check .
          - name: Type check
            command: uv run ty check
          - name: Architecture
            command: uv run python scripts/analyze_dependencies.py --path prdiffer
          - name: Unit tests
            command: uv run pytest tests -v --tb=short --junitxml=junit.xml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # setup-uv v5 accepts python-version (not python-version-file)
          python-version: "3.14"

      - name: Install project and dev dependencies
        run: uv sync --frozen --group dev

      - name: Show tool versions
        run: |
          uv run python --version
          uv --version
          uv run ruff --version
          uv run ty version
          uv run pytest --version

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload pytest report on failure
        if: failure() && matrix.name == 'Unit tests'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: junit.xml
          if-no-files-found: ignore
